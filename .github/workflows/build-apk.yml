<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>نظام تقارير الإنتاج الصناعي</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --radius: 12px;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 75px; user-select: none; }

    header {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .badge-offline { background: rgba(16, 185, 129, 0.2); color: #34d399; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.4); }

    .nav-tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      display: flex;
      border-top: 1px solid var(--border);
      box-shadow: 0 -3px 10px rgba(0,0,0,0.05);
      z-index: 50;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .nav-btn.active { color: var(--primary-light); border-top: 3px solid var(--primary-light); }

    .container { padding: 16px; max-width: 650px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .input-field, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      background: #f8fafc;
      outline: none;
    }
    .input-field:focus, select:focus { border-color: var(--primary-light); background: #fff; }

    .counter-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-step {
      width: 46px;
      height: 46px;
      background: #e2e8f0;
      border: 1px solid var(--border);
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary-light);
      color: #fff;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
    }
    .btn-primary:active { background: var(--primary); }

    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .kpi-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .kpi-num { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-top: 4px; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .tag-item {
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-delete { color: var(--danger); font-weight: bold; cursor: pointer; border: none; background: transparent; font-size: 1rem; }

    .add-input-group { display: flex; gap: 8px; }
    .btn-add { background: var(--success); color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .report-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>نظام الإنتاج الصناعي</h1>
  </div>
  <span class="badge-offline">محلي جاهز (Offline)</span>
</header>

<div class="container">

  <!-- تبويب إدخال تقرير الإنتاج -->
  <div id="tab-report" class="tab-content active">
    <div class="card">
      <div class="card-title">إدخال تقرير تشغيل وردية</div>
      <form id="reportForm">
        
        <div class="form-group">
          <label>الماكينة / الخط:</label>
          <select id="selMachine" class="input-field" required></select>
        </div>

        <div class="form-group">
          <label>المشغل / الفني المسئول:</label>
          <select id="selOperator" class="input-field" required></select>
        </div>

        <div class="form-group">
          <label>صنف المنتج:</label>
          <select id="selProduct" class="input-field" required></select>
        </div>

        <div class="form-group">
          <label>الوردية:</label>
          <select id="shift" class="input-field">
            <option value="الوردية الأولى (صباحية)">الوردية الأولى (صباحية)</option>
            <option value="الوردية الثانية (مسائية)">الوردية الثانية (مسائية)</option>
            <option value="الوردية الثالثة (ليلية)">الوردية الثالثة (ليلية)</option>
          </select>
        </div>

        <div class="form-group">
          <label>الإنتاج السليم (قطع / وحدات):</label>
          <div class="counter-row">
            <button type="button" class="btn-step" onclick="stepValue('goodQty', -50)">-</button>
            <input type="number" id="goodQty" class="input-field" value="1000" required />
            <button type="button" class="btn-step" onclick="stepValue('goodQty', 50)">+</button>
          </div>
        </div>

        <div class="form-group">
          <label>الإنتاج التالف / الهدر (Scrap):</label>
          <div class="counter-row">
            <button type="button" class="btn-step" onclick="stepValue('scrapQty', -5)">-</button>
            <input type="number" id="scrapQty" class="input-field" value="20" required />
            <button type="button" class="btn-step" onclick="stepValue('scrapQty', 5)">+</button>
          </div>
        </div>

        <div class="form-group">
          <label>إجمالي التوقفات (بالدقائق):</label>
          <div class="counter-row">
            <button type="button" class="btn-step" onclick="stepValue('downtime', -10)">-</button>
            <input type="number" id="downtime" class="input-field" value="30" required />
            <button type="button" class="btn-step" onclick="stepValue('downtime', 10)">+</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">حفظ واعتماد التقرير</button>
      </form>
    </div>
  </div>

  <!-- تبويب الإعدادات (إضافة وحذف المكائن، المشغلين، الأصناف) -->
  <div id="tab-settings" class="tab-content">
    
    <div class="card">
      <div class="card-title">إدارة المكائن وخطوط الإنتاج</div>
      <div class="add-input-group">
        <input type="text" id="newMachineInput" class="input-field" placeholder="اسم أو رقم الماكينة" />
        <button type="button" class="btn-add" onclick="addItem('machines', 'newMachineInput')">إضافة</button>
      </div>
      <div id="machinesTags" class="tag-list"></div>
    </div>

    <div class="card">
      <div class="card-title">إدارة أسماء المشغلين والفنيين</div>
      <div class="add-input-group">
        <input type="text" id="newOperatorInput" class="input-field" placeholder="اسم المشغل / الفني" />
        <button type="button" class="btn-add" onclick="addItem('operators', 'newOperatorInput')">إضافة</button>
      </div>
      <div id="operatorsTags" class="tag-list"></div>
    </div>

    <div class="card">
      <div class="card-title">إدارة أصناف المنتجات</div>
      <div class="add-input-group">
        <input type="text" id="newProductInput" class="input-field" placeholder="اسم الصنف / المنتج" />
        <button type="button" class="btn-add" onclick="addItem('products', 'newProductInput')">إضافة</button>
      </div>
      <div id="productsTags" class="tag-list"></div>
    </div>

  </div>

  <!-- تبويب السجلات -->
  <div id="tab-records" class="tab-content">
    <div class="kpi-grid">
      <div class="kpi-box">
        <div>إجمالي السليم</div>
        <div id="kpiGood" class="kpi-num">0</div>
      </div>
      <div class="kpi-box">
        <div>إجمالي الهدر</div>
        <div id="kpiScrap" class="kpi-num" style="color: var(--danger);">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>سجل التقارير المسجلة</span>
        <button class="badge-offline" style="border:none; cursor:pointer;" onclick="exportReports()">تصدير CSV</button>
      </div>
      <div id="reportsList"></div>
    </div>
  </div>

</div>

<div class="nav-tabs">
  <button class="nav-btn active" onclick="switchTab('tab-report', this)">
    <span>📝</span>
    <span>إدخال تقرير</span>
  </button>
  <button class="nav-btn" onclick="switchTab('tab-settings', this)">
    <span>⚙️</span>
    <span>المكائن والأصناف</span>
  </button>
  <button class="nav-btn" onclick="switchTab('tab-records', this)">
    <span>📊</span>
    <span>السجلات</span>
  </button>
</div>

<script>
  const defaultData = {
    machines: ["ماكينة 01", "ماكينة 02"],
    operators: ["مشغل 1", "مشغل 2"],
    products: ["صنف 1", "صنف 2"]
  };

  function getData(key) {
    const data = localStorage.getItem('factory_' + key);
    return data ? JSON.parse(data) : defaultData[key];
  }

  function setData(key, val) {
    localStorage.setItem('factory_' + key, JSON.stringify(val));
  }

  function renderTags(key, containerId, selectId) {
    const list = getData(key);
    const container = document.getElementById(containerId);
    const select = document.getElementById(selectId);

    container.innerHTML = list.map((item, idx) => `
      <div class="tag-item">
        <span>${item}</span>
        <button class="tag-delete" onclick="deleteItem('${key}', ${idx})">&times;</button>
      </div>
    `).join('');

    select.innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
  }

  function refreshAll() {
    renderTags('machines', 'machinesTags', 'selMachine');
    renderTags('operators', 'operatorsTags', 'selOperator');
    renderTags('products', 'productsTags', 'selProduct');
  }

  function addItem(key, inputId) {
    const input = document.getElementById(inputId);
    const val = input.value.trim();
    if (!val) return;

    const list = getData(key);
    list.push(val);
    setData(key, list);
    input.value = '';
    refreshAll();
  }

  function deleteItem(key, idx) {
    const list = getData(key);
    list.splice(idx, 1);
    setData(key, list);
    refreshAll();
  }

  function stepValue(id, delta) {
    const el = document.getElementById(id);
    let val = parseInt(el.value || 0, 10);
    val = Math.max(0, val + delta);
    el.value = val;
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    if (tabId === 'tab-records') renderReports();
  }

  function getReports() {
    return JSON.parse(localStorage.getItem('factory_reports') || '[]');
  }

  document.getElementById('reportForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const report = {
      id: Date.now(),
      date: new Date().toLocaleDateString('ar-EG'),
      time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      machine: document.getElementById('selMachine').value,
      operator: document.getElementById('selOperator').value,
      product: document.getElementById('selProduct').value,
      shift: document.getElementById('shift').value,
      goodQty: parseInt(document.getElementById('goodQty').value, 10),
      scrapQty: parseInt(document.getElementById('scrapQty').value, 10),
      downtime: parseInt(document.getElementById('downtime').value, 10)
    };

    const reports = getReports();
    reports.unshift(report);
    localStorage.setItem('factory_reports', JSON.stringify(reports));

    alert('تم حفظ التقرير بنجاح!');
  });

  function renderReports() {
    const reports = getReports();
    let totalGood = 0;
    let totalScrap = 0;

    const container = document.getElementById('reportsList');
    if (reports.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">لا توجد تقارير مسجلة حتى الآن.</p>';
    } else {
      container.innerHTML = reports.map(r => {
        totalGood += r.goodQty;
        totalScrap += r.scrapQty;
        return `
          <div class="report-card">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:4px;">
              <span>${r.machine}</span>
              <span style="color:#64748b;">${r.date} - ${r.time}</span>
            </div>
            <div><strong>الصنف:</strong> ${r.product} | <strong>المشغل:</strong> ${r.operator}</div>
            <div style="margin-top:4px;">
              <span style="color:var(--success); font-weight:bold;">سليم: ${r.goodQty}</span> | 
              <span style="color:var(--danger); font-weight:bold;">تالف: ${r.scrapQty}</span> | 
              <span>توقف: ${r.downtime} دقيقة</span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('kpiGood').innerText = totalGood.toLocaleString();
    document.getElementById('kpiScrap').innerText = totalScrap.toLocaleString();
  }

  function exportReports() {
    const reports = getReports();
    if (reports.length === 0) return alert('لا توجد بيانات لتصديرها');

    let csv = "التاريخ,الوقت,الماكينة,المشغل,الصنف,الوردية,السليم,الهدر,التوقف بالدقائق\n";
    reports.forEach(r => {
      csv += `"${r.date}","${r.time}","${r.machine}","${r.operator}","${r.product}","${r.shift}",${r.goodQty},${r.scrapQty},${r.downtime}\n`;
    });

    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `تقارير_الإنتاج_${Date.now()}.csv`;
    link.click();
  }

  refreshAll();
</script>
</body>
</html>
